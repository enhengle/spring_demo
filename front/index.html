<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上下班时间记录系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 上下班时间记录系统</h1>
            <p class="subtitle">根据国家日历记录上下班时间，自动计算平均工时</p>
        </header>

        <div class="main-content">
            <!-- 左侧：记录表单 -->
            <div class="left-panel">
                <div class="card">
                    <h2>📝 添加/编辑记录</h2>
                    <form id="recordForm">
                        <input type="hidden" id="recordId">
                        
                        <div class="form-group">
                            <label for="workDate">日期 <span class="required">*</span></label>
                            <input type="date" id="workDate" required>
                            <span id="workdayIndicator" class="workday-indicator"></span>
                        </div>

                        <div class="form-group">
                            <label for="startTime">上班时间 <span class="required">*</span></label>
                            <input type="time" id="startTime" required>
                        </div>

                        <div class="form-group">
                            <label for="endTime">下班时间</label>
                            <input type="time" id="endTime">
                        </div>

                        <div class="form-group">
                            <label for="remark">备注</label>
                            <textarea id="remark" rows="3" placeholder="可选，添加备注信息"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
                        </div>
                    </form>
                </div>

                <!-- 批量导入 -->
                <div class="card">
                    <h2>📥 批量导入</h2>
                    <div class="form-group">
                        <label>CSV数据格式：</label>
                        <div class="format-hint">
                            <code>日期	星期	上班时间	下班时间</code><br>
                            <code>2025/06/25	星期三	09:30:00	19:56:39</code>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="batchImportData">批量数据 <span class="required">*</span></label>
                        <textarea id="batchImportData" rows="8" placeholder="请粘贴CSV数据，第一行为表头（会自动跳过）&#10;示例：&#10;日期	日期	上班时间	下班时间&#10;2025/06/25	星期三	09:30:00	19:56:39&#10;2025/06/26	星期四	09:00:00	18:00:00"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary" onclick="batchImport()">执行导入</button>
                        <button type="button" class="btn btn-secondary" onclick="clearBatchImport()">清空</button>
                    </div>
                    <div id="batchImportResult" class="import-result" style="display: none;"></div>
                </div>

                <!-- 平均工时统计 -->
                <div class="card">
                    <h2>📊 平均工时统计</h2>
                    
                    <!-- 统计筛选条件 -->
                    <div class="filter-section">
                        <div class="form-group">
                            <label>时间范围</label>
                            <select id="timeRangeType" class="form-control" onchange="onTimeRangeTypeChange()">
                                <option value="all">全部数据</option>
                                <option value="week">周</option>
                                <option value="month">月</option>
                                <option value="year">年</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                        
                        <div class="form-group" id="timeRangeValueGroup" style="display: none;">
                            <label id="timeRangeValueLabel">时间值</label>
                            <input type="text" id="timeRangeValue" class="form-control" placeholder="例如：2025-W01 或 2025-01 或 2025">
                            <small class="form-hint">周：2025-W01，月：2025-01，年：2025（留空表示当前）</small>
                        </div>
                        
                        <div class="form-group" id="customDateRangeGroup" style="display: none;">
                            <label>自定义日期范围</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="date" id="customStartDate" class="form-control">
                                <span>至</span>
                                <input type="date" id="customEndDate" class="form-control">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>统计选项</label>
                            <div class="checkbox-group">
                                <label><input type="checkbox" id="onlyWorkday" value="1"> 仅统计工作日</label>
                                <label><input type="checkbox" id="excludeOvertime" value="1"> 剔除加班（超过8小时部分）</label>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button class="btn btn-primary" onclick="loadAverageStats()">查询统计</button>
                            <button class="btn btn-secondary" onclick="resetStatsFilter()">重置</button>
                        </div>
                    </div>
                    
                    <!-- 统计结果 -->
                    <div id="timeRangeDisplay" class="time-range-display" style="display: none;"></div>
                    
                    <div id="averageStats" class="stats-container">
                        <div class="stat-item">
                            <div class="stat-label">总记录数</div>
                            <div class="stat-value" id="totalRecords">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">工作日记录数</div>
                            <div class="stat-value" id="workdayRecords">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">总工作时长</div>
                            <div class="stat-value" id="totalHours">0 小时</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">工作日总时长</div>
                            <div class="stat-value" id="workdayTotalHours">0 小时</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">平均工作时长</div>
                            <div class="stat-value highlight" id="averageHours">0 小时</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">工作日平均时长</div>
                            <div class="stat-value highlight" id="workdayAverageHours">0 小时</div>
                        </div>
                        <div class="stat-item" id="normalStatsItem" style="display: none;">
                            <div class="stat-label">剔除加班后平均时长</div>
                            <div class="stat-value highlight" id="normalAverageHours">0 小时</div>
                        </div>
                        <div class="stat-item" id="overtimeStatsItem" style="display: none;">
                            <div class="stat-label">加班总时长</div>
                            <div class="stat-value" id="overtimeHours">0 小时</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：记录列表 -->
            <div class="right-panel">
                <div class="card">
                    <div class="card-header">
                        <h2>📋 记录列表</h2>
                        <div class="header-actions">
                            <input type="date" id="filterStartDate" class="date-filter" placeholder="开始日期">
                            <input type="date" id="filterEndDate" class="date-filter" placeholder="结束日期">
                            <button class="btn btn-info" onclick="loadRecords()">查询</button>
                            <button class="btn btn-secondary" onclick="clearFilter()">清空</button>
                        </div>
                    </div>
                    <div id="recordList" class="record-list">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
