<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dify AI助手测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .config-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .chat-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chat-box {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        
        .chat-box h3 {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            margin: 0;
            font-size: 16px;
            color: #333;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message.assistant {
            align-items: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        
        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .chat-input {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .chat-input button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .chat-input button:hover:not(:disabled) {
            background: #5568d3;
        }
        
        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .conversation-info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Dify AI助手测试页面</h1>
            <p>支持阻塞模式和流式模式对话</p>
        </div>
        
        <div class="content">
            <div class="config-section">
                <h2>⚙️ 配置信息</h2>
                <div class="form-group">
                    <label>API地址：</label>
                    <input type="text" id="apiUrl" value="/api/dify/chat" readonly>
                </div>
                <div class="form-group">
                    <label>响应模式：</label>
                    <select id="responseMode">
                        <option value="blocking">阻塞模式（一次性返回）</option>
                        <option value="streaming">流式模式（实时返回）</option>
                    </select>
                </div>
            </div>
            
            <div class="chat-section">
                <div class="chat-box">
                    <h3>💬 阻塞模式对话</h3>
                    <div id="blockingStatus" class="status info" style="display: none;"></div>
                    <div class="chat-messages" id="blockingMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="blockingInput" placeholder="输入消息..." 
                               onkeypress="if(event.key==='Enter') sendBlockingMessage()">
                        <button onclick="sendBlockingMessage()" id="blockingBtn">发送</button>
                    </div>
                </div>
                
                <div class="chat-box">
                    <h3>🌊 流式模式对话</h3>
                    <div id="streamingStatus" class="status info" style="display: none;"></div>
                    <div class="chat-messages" id="streamingMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="streamingInput" placeholder="输入消息..." 
                               onkeypress="if(event.key==='Enter') sendStreamingMessage()">
                        <button onclick="sendStreamingMessage()" id="streamingBtn">发送</button>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-secondary" onclick="clearBlockingChat()">清空阻塞模式记录</button>
                <button class="btn btn-secondary" onclick="clearStreamingChat()">清空流式模式记录</button>
            </div>
        </div>
    </div>
    
    <script>
        let blockingConversationId = null;
        let streamingConversationId = null;
        
        // 阻塞模式发送消息
        async function sendBlockingMessage() {
            const input = document.getElementById('blockingInput');
            const btn = document.getElementById('blockingBtn');
            const messagesDiv = document.getElementById('blockingMessages');
            const statusDiv = document.getElementById('blockingStatus');
            
            const message = input.value.trim();
            if (!message) return;
            
            // 显示用户消息
            addMessage(messagesDiv, 'user', message);
            input.value = '';
            btn.disabled = true;
            showStatus(statusDiv, 'info', '正在发送消息...');
            
            try {
                const requestBody = {
                    message: message,
                    conversationId: blockingConversationId,
                    responseMode: 'blocking'
                };
                
                const response = await fetch('/api/dify/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.code === 0 && result.data) {
                    const data = result.data;
                    addMessage(messagesDiv, 'assistant', data.answer || '抱歉，我暂时无法回答这个问题。');
                    
                    if (data.conversationId) {
                        blockingConversationId = data.conversationId;
                        showConversationInfo(messagesDiv, blockingConversationId, data.messageId);
                    }
                    
                    showStatus(statusDiv, 'success', '消息发送成功');
                } else {
                    throw new Error(result.message || '请求失败');
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                addMessage(messagesDiv, 'assistant', '错误: ' + error.message);
                showStatus(statusDiv, 'error', '发送失败: ' + error.message);
            } finally {
                btn.disabled = false;
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }
        
        // 流式模式发送消息
        function sendStreamingMessage() {
            const input = document.getElementById('streamingInput');
            const btn = document.getElementById('streamingBtn');
            const messagesDiv = document.getElementById('streamingMessages');
            const statusDiv = document.getElementById('streamingStatus');
            
            const message = input.value.trim();
            if (!message) return;
            
            // 显示用户消息
            addMessage(messagesDiv, 'user', message);
            input.value = '';
            btn.disabled = true;
            showStatus(statusDiv, 'info', '正在建立流式连接...');
            
            // 创建助手消息占位符
            const assistantMsgId = 'assistant-' + Date.now();
            const assistantMsgDiv = document.createElement('div');
            assistantMsgDiv.id = assistantMsgId;
            assistantMsgDiv.className = 'message assistant';
            assistantMsgDiv.innerHTML = `
                <div class="message-content">
                    <span class="loading"></span> 正在接收回复...
                </div>
            `;
            messagesDiv.appendChild(assistantMsgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            const requestBody = {
                message: message,
                conversationId: streamingConversationId,
                responseMode: 'streaming'
            };
            
            let fullAnswer = '';
            let currentConversationId = null;
            let currentMessageId = null;
            
            fetch('/api/dify/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                if (!response.body) {
                    throw new Error('响应体为空');
                }
                
                showStatus(statusDiv, 'info', '正在接收流式数据...');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            // 流结束
                            const assistantMsg = document.getElementById(assistantMsgId);
                            if (assistantMsg) {
                                assistantMsg.innerHTML = `
                                    <div class="message-content">${escapeHtml(fullAnswer)}</div>
                                `;
                            }
                            
                            if (currentConversationId) {
                                streamingConversationId = currentConversationId;
                                showConversationInfo(messagesDiv, currentConversationId, currentMessageId);
                            }
                            
                            showStatus(statusDiv, 'success', '流式响应完成');
                            btn.disabled = false;
                            setTimeout(() => {
                                statusDiv.style.display = 'none';
                            }, 3000);
                            return;
                        }
                        
                        // 解码数据
                        buffer += decoder.decode(value, { stream: true });
                        
                        // 处理SSE格式的数据
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        
                        for (const line of lines) {
                            const trimmedLine = line.trim();
                            if (!trimmedLine) continue;
                            
                            if (trimmedLine.startsWith('data: ')) {
                                const data = trimmedLine.substring(6).trim();
                                
                                if (data === '[DONE]' || data === '') {
                                    continue;
                                }
                                
                                try {
                                    const eventData = JSON.parse(data);
                                    
                                    // 处理消息片段
                                    if (eventData.chunk) {
                                        fullAnswer += eventData.chunk;
                                        
                                        const assistantMsg = document.getElementById(assistantMsgId);
                                        if (assistantMsg) {
                                            assistantMsg.innerHTML = `
                                                <div class="message-content">${escapeHtml(fullAnswer)}</div>
                                            `;
                                        }
                                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                                        
                                        if (eventData.conversationId) {
                                            currentConversationId = eventData.conversationId;
                                        }
                                        if (eventData.messageId) {
                                            currentMessageId = eventData.messageId;
                                        }
                                    }
                                    // 处理完整响应
                                    else if (eventData.answer !== undefined) {
                                        fullAnswer = eventData.answer || fullAnswer;
                                        const assistantMsg = document.getElementById(assistantMsgId);
                                        if (assistantMsg) {
                                            assistantMsg.innerHTML = `
                                                <div class="message-content">${escapeHtml(fullAnswer)}</div>
                                            `;
                                        }
                                        
                                        if (eventData.conversationId) {
                                            streamingConversationId = eventData.conversationId;
                                            showConversationInfo(messagesDiv, eventData.conversationId, eventData.messageId);
                                        }
                                        
                                        showStatus(statusDiv, 'success', '流式响应完成');
                                        btn.disabled = false;
                                        setTimeout(() => {
                                            statusDiv.style.display = 'none';
                                        }, 3000);
                                        return;
                                    }
                                    // 处理错误
                                    else if (eventData.error || eventData.message) {
                                        throw new Error(eventData.message || eventData.error || '未知错误');
                                    }
                                } catch (e) {
                                    if (data && data !== '[DONE]') {
                                        console.warn('解析SSE数据失败:', data.substring(0, 100), e);
                                    }
                                }
                            }
                        }
                        
                        // 继续读取
                        readStream();
                    }).catch(error => {
                        console.error('读取流式数据失败:', error);
                        const assistantMsg = document.getElementById(assistantMsgId);
                        if (assistantMsg) {
                            assistantMsg.innerHTML = `
                                <div class="message-content">错误: ${error.message}</div>
                            `;
                        }
                        showStatus(statusDiv, 'error', '流式响应失败: ' + error.message);
                        btn.disabled = false;
                        setTimeout(() => {
                            statusDiv.style.display = 'none';
                        }, 3000);
                    });
                }
                
                readStream();
            })
            .catch(error => {
                console.error('发送流式消息失败:', error);
                const assistantMsg = document.getElementById(assistantMsgId);
                if (assistantMsg) {
                    assistantMsg.innerHTML = `
                        <div class="message-content">错误: ${error.message}</div>
                    `;
                }
                showStatus(statusDiv, 'error', '发送失败: ' + error.message);
                btn.disabled = false;
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            });
        }
        
        // 添加消息
        function addMessage(container, role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
                <div class="message-time">${new Date().toLocaleTimeString()}</div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        // 显示对话信息
        function showConversationInfo(container, conversationId, messageId) {
            const infoDiv = document.createElement('div');
            infoDiv.className = 'conversation-info';
            infoDiv.innerHTML = `
                <strong>对话ID:</strong> ${conversationId || 'N/A'}<br>
                <strong>消息ID:</strong> ${messageId || 'N/A'}
            `;
            container.appendChild(infoDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        // 显示状态
        function showStatus(div, type, message) {
            div.className = `status ${type}`;
            div.textContent = message;
            div.style.display = 'block';
        }
        
        // 清空聊天记录
        function clearBlockingChat() {
            document.getElementById('blockingMessages').innerHTML = '';
            blockingConversationId = null;
        }
        
        function clearStreamingChat() {
            document.getElementById('streamingMessages').innerHTML = '';
            streamingConversationId = null;
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
