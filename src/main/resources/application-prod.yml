# 生产环境配置
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-server:3306/demo_prod?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${SERVER_PORT:1234}

logging:
  level:
    root: WARN
    com.practise.demo: INFO

# Apollo配置（生产环境）
# apollo:
#   meta: ${APOLLO_META:http://prod-apollo-server:8080}
#   bootstrap:
#     enabled: true
#     namespaces: application,prod-config

# Swagger在生产环境关闭（通过@Profile注解已自动禁用，这里再次确认）
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

