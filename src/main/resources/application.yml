spring:
  application:
    name: spring-demo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 默认dev环境，可通过环境变量或启动参数指定
  # 数据源配置（支持从apollo或application获取）
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
spark:
  ai:
    apiKey:
    appId:
    apiSecret:
    apiUrl: https://spark-api-open.xf-yun.com/v2/chat/completions
    model: spark-x
    apiPassword: ${spark.ai.apiKey}:${spark.ai.apiSecret}

  # Apollo配置（可选，如果使用apollo则启用）
  # apollo:
  #   meta: ${APOLLO_META:http://localhost:8080}
  #   bootstrap:
  #     enabled: ${APOLLO_ENABLED:false}
  #     namespaces: application

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.practise.demo.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

# 服务器配置
server:
  port: ${SERVER_PORT:1234}
  shutdown: graceful  # 优雅停机（Spring Boot 2.3+支持）
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    # 优雅停机等待时间（秒），默认30秒
    # 可以通过spring.lifecycle.timeout-per-shutdown-phase配置
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 优雅停机等待时间

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.practise.demo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 公共配置
common:
  logDir: ${LOG_DIR:./logs}

